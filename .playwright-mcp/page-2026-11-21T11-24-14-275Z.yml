          - generic [ref=f4e171]:
            - generic [ref=f4e173]:
              - article [ref=f4e174]:
                - heading "Monolith" [level=4] [ref=f4e175]
                - paragraph [ref=f4e176]: One codebase, one build, one deploy.
                - paragraph [ref=f4e177]: Strengths
                - list [ref=f4e178]:
                  - listitem [ref=f4e179]: ✓ Simplest mental model — a single repo, toolchain and build
                  - listitem [ref=f4e180]: ✓ Sharing code is just an import; no runtime integration cost
                  - listitem [ref=f4e181]: ✓ One bundle, so dependency versions and UI stay consistent by default
                  - listitem [ref=f4e182]: ✓ Local development, debugging and end-to-end testing are straightforward
                - paragraph [ref=f4e183]: Trade-offs
                - list [ref=f4e184]:
                  - listitem [ref=f4e185]: ✕ Every team rides the same release train — one bad merge blocks everyone
                  - listitem [ref=f4e186]: ✕ Build and CI times grow with the codebase
                  - listitem [ref=f4e187]: ✕ Framework and major-version upgrades become all-or-nothing events
                  - listitem [ref=f4e188]: ✕ Ownership boundaries blur as the application grows
              - article [ref=f4e189]:
                - heading "Micro Frontends" [level=4] [ref=f4e190]
                - paragraph [ref=f4e191]: Independent apps per team, composed at runtime.
                - paragraph [ref=f4e192]: Strengths
                - list [ref=f4e193]:
                  - listitem [ref=f4e194]: ✓ Teams ship on their own cadence with no shared release train
                  - listitem [ref=f4e195]: ✓ Failure and upgrade blast radius stays scoped to one domain
                  - listitem [ref=f4e196]: ✓ Stacks can diverge, so upgrades happen incrementally
                  - listitem [ref=f4e197]: ✓ Ownership mirrors team boundaries instead of fighting them
                - paragraph [ref=f4e198]: Trade-offs
                - list [ref=f4e199]:
                  - listitem [ref=f4e200]: ✕ Duplicate dependencies inflate total bytes without deliberate sharing
                  - listitem [ref=f4e201]: ✕ Runtime composition, routing and shared state add real complexity
                  - listitem [ref=f4e202]: ✕ Cross-app consistency needs a design system plus governance
                  - listitem [ref=f4e203]: ✕ Local development, observability and E2E testing get harder
            - paragraph [ref=f4e204]:
              - strong [ref=f4e205]: "In practice:"
              - text: stay a monolith until deploy contention, team count or domain boundaries make the shared release train the bottleneck. Micro frontends buy autonomy, and you pay for it in infrastructure.
