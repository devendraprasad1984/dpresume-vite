      - generic [ref=e48]: "# Devendra Prasad **Principal Frontend Engineer / Architect** · 19 years of experience New Delhi, India · devendraprasad1984@gmail.com · https://devendraprasad1984.github.io/ · [linkedin.com/in/devendraprasad](https://www.linkedin.com/in/devendraprasad/) · [github.com/devendraprasad1984](https://github.com/devendraprasad1984) ## Summary Principal frontend engineer, architect and engineering leader focused on scalable, high-performance digital commerce platforms. Specialises in React, Next.js, micro-frontends, monorepos and CMS-driven architectures, with deep experience leading the global multi-tenant frontend architecture of a high-traffic e-commerce platform (giftcards.com). - Led the migration from AEM to Next.js and Payload CMS, removing AEM licensing and saving **$1.5 million per year**. - Architected the micro-frontend architecture for giftcards.com: development time cut by **60%** through AI adoption, deployment time cut by approx **40%** through improved build and CI/CD pipelines. - Led the PDP redesign with fee transparency: Core Web Vitals in the green zone, conversion **+18%**, customer queries **-20%**. - Reduced frontend build time from 5+ minutes to 0.5 minute using eslint and snapshot caching. - Set engineering standards and the D2C technical roadmap; mentor Senior and Staff engineers. - Recipient of the **D2C Innovation Award, 2026**. ## Experience ### Blackhawk Network (BHN), Principal / Senior Staff Frontend Engineer | Oct 2022 - present *giftcards.com: multi-tenant e-commerce platform* **Architecture and platform** - Own and lead the global multi-tenant frontend architecture of the high-traffic e-commerce platform (giftcards.com), responsible for availability, scale and performance on AEM Cloud. - Led the platform migration from AEM to Next.js and Payload CMS, removing AEM licensing (**$1.5 million per year**). - Architected the micro-frontend architecture with reusable patterns across apps; development times **-60%** through AI adoption, deployment times approx **-40%** by improving build and CI/CD pipelines. - Design and implement enterprise-scale web architectures using React, Next.js, micro-frontends and monorepos, integrating Payload CMS and Adobe Experience Manager (AEM). - Co-developer of the BHN design system; help with onboarding and cross-team development. **Business outcomes** - Led the PDP redesign with fee transparency: Core Web Vitals to the green zone, conversion **+18%**, customer queries **-20%**. - Improved the checkout journey, increasing the conversion metric and transparency for customers. **Engineering excellence and governance** - Reduced frontend build time from 5+ minutes to 0.5 minute using eslint and snapshot caching. - Established automated CI/CD pipelines (GitHub Actions, SonarQube, Snyk) enforcing security scanning, automated testing and zero-downtime releases. - Standardise TDD and spec-driven frontend development (React, Next.js, HTML, CSS, JavaScript); drive GitHub Copilot adoption across the team. - Govern code quality with SonarQube, git hooks, Snyk scans and a constant review cycle. - Secure applications against XSS and CSRF; auth patterns include OAuth2.0 and JWT. **Leadership and influence** - Set engineering standards and own the technical roadmap for D2C; mentor Senior and Staff engineers. - Lead the end-to-end operational lifecycle: architecture design, release strategies, incidents, triage and SLA metrics across teams. - Contribute to engineering metrics, working groups, architecture design and leadership discussions. - Help recruit, grow and enable the team; code reviewer and mentor. *Stack: React, Next.js, Payload CMS, AEM, micro-frontends, monorepos, GitHub Actions, SonarQube, Snyk* ### Fictiv India Pvt Ltd | 2 months ### Thoughtworks (via Geektrust), Lead UI Developer | Sep 2021 - Aug 2022 (6 months) - Kroger: checkout flash sales and analytics. - First Abu Dhabi Bank: Colleague Experience Portal. ### NatWest / Royal Bank of Scotland (RBS), Tech Lead Developer | Oct 2011 - Sep 2021 (10 years) - Colleague Experience Group Economics, Smart Disability Initiatives, Arria NLG Budgets & Forecasts Narratives, Finance Portal, Cash Nostro Management System. - Led the move of finance tooling from VB6 / MS-SQL to React. ### Earlier career | 2007 - 2011 - Syntel Inc (1.3 years), Software Engineer; 9 Dimensions; freelance developer; software developer at DAVIM (VBA, VB6). ## Certifications - Foundations of AI & Agentic AI, Simplilearn (20 Sep 2026) - Advanced Generative AI Development on AWS, AWS Training and Certification (15 Jul 2026) - Building Advanced Agentic Systems on AWS, AWS Training and Certification (20 Jul 2026) ## Education - PGDITM, Symbiosis, Pune (2017) - BTech IT, MDU, Rohtak (2007) - HND Computing, Pearson Edexcel, UK (2004) ## Recognition and community - D2C Innovation Award, Blackhawk Network (2026) - Open source: **oneliners** (npm) ## Skills React 10+ yrs · HTML/CSS/JS 12+ · GraphQL 7+ · CI/CD 7+ · AEM 4+ · Next.js 2+ · Payload CMS 2+ · Vitest, Jest, Mocha · Turborepo, Vite, Webpack"
