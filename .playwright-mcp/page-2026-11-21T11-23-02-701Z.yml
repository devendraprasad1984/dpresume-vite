          - generic [ref=f2e172]:
            - generic [ref=f2e174]:
              - article [ref=f2e175]:
                - heading "Monolith" [level=4] [ref=f2e176]
                - paragraph [ref=f2e177]: One codebase, one build, one deploy.
                - paragraph [ref=f2e178]: Strengths
                - list [ref=f2e179]:
                  - listitem [ref=f2e180]: ✓ Simplest mental model — a single repo, toolchain and build
                  - listitem [ref=f2e181]: ✓ Sharing code is just an import; no runtime integration cost
                  - listitem [ref=f2e182]: ✓ One bundle, so dependency versions and UI stay consistent by default
                  - listitem [ref=f2e183]: ✓ Local development, debugging and end-to-end testing are straightforward
                - paragraph [ref=f2e184]: Trade-offs
                - list [ref=f2e185]:
                  - listitem [ref=f2e186]: ✕ Every team rides the same release train — one bad merge blocks everyone
                  - listitem [ref=f2e187]: ✕ Build and CI times grow with the codebase
                  - listitem [ref=f2e188]: ✕ Framework and major-version upgrades become all-or-nothing events
                  - listitem [ref=f2e189]: ✕ Ownership boundaries blur as the application grows
              - article [ref=f2e190]:
                - heading "Micro Frontends" [level=4] [ref=f2e191]
                - paragraph [ref=f2e192]: Independent apps per team, composed at runtime.
                - paragraph [ref=f2e193]: Strengths
                - list [ref=f2e194]:
                  - listitem [ref=f2e195]: ✓ Teams ship on their own cadence with no shared release train
                  - listitem [ref=f2e196]: ✓ Failure and upgrade blast radius stays scoped to one domain
                  - listitem [ref=f2e197]: ✓ Stacks can diverge, so upgrades happen incrementally
                  - listitem [ref=f2e198]: ✓ Ownership mirrors team boundaries instead of fighting them
                - paragraph [ref=f2e199]: Trade-offs
                - list [ref=f2e200]:
                  - listitem [ref=f2e201]: ✕ Duplicate dependencies inflate total bytes without deliberate sharing
                  - listitem [ref=f2e202]: ✕ Runtime composition, routing and shared state add real complexity
                  - listitem [ref=f2e203]: ✕ Cross-app consistency needs a design system plus governance
                  - listitem [ref=f2e204]: ✕ Local development, observability and E2E testing get harder
            - paragraph [ref=f2e205]:
              - strong [ref=f2e206]: "In practice:"
              - text: stay a monolith until deploy contention, team count or domain boundaries make the shared release train the bottleneck. Micro frontends buy autonomy, and you pay for it in infrastructure.
