          - generic [ref=f4e473]:
            - generic [ref=f4e475]:
              - article [ref=f4e476]:
                - heading "Monolith" [level=4] [ref=f4e477]
                - paragraph [ref=f4e478]: One codebase, one build, one deploy.
                - paragraph [ref=f4e479]: Strengths
                - list [ref=f4e480]:
                  - listitem [ref=f4e481]: ✓ Simplest mental model — a single repo, toolchain and build
                  - listitem [ref=f4e482]: ✓ Sharing code is just an import; no runtime integration cost
                  - listitem [ref=f4e483]: ✓ One bundle, so dependency versions and UI stay consistent by default
                  - listitem [ref=f4e484]: ✓ Local development, debugging and end-to-end testing are straightforward
                - paragraph [ref=f4e485]: Trade-offs
                - list [ref=f4e486]:
                  - listitem [ref=f4e487]: ✕ Every team rides the same release train — one bad merge blocks everyone
                  - listitem [ref=f4e488]: ✕ Build and CI times grow with the codebase
                  - listitem [ref=f4e489]: ✕ Framework and major-version upgrades become all-or-nothing events
                  - listitem [ref=f4e490]: ✕ Ownership boundaries blur as the application grows
              - article [ref=f4e491]:
                - heading "Micro Frontends" [level=4] [ref=f4e492]
                - paragraph [ref=f4e493]: Independent apps per team, composed at runtime.
                - paragraph [ref=f4e494]: Strengths
                - list [ref=f4e495]:
                  - listitem [ref=f4e496]: ✓ Teams ship on their own cadence with no shared release train
                  - listitem [ref=f4e497]: ✓ Failure and upgrade blast radius stays scoped to one domain
                  - listitem [ref=f4e498]: ✓ Stacks can diverge, so upgrades happen incrementally
                  - listitem [ref=f4e499]: ✓ Ownership mirrors team boundaries instead of fighting them
                - paragraph [ref=f4e500]: Trade-offs
                - list [ref=f4e501]:
                  - listitem [ref=f4e502]: ✕ Duplicate dependencies inflate total bytes without deliberate sharing
                  - listitem [ref=f4e503]: ✕ Runtime composition, routing and shared state add real complexity
                  - listitem [ref=f4e504]: ✕ Cross-app consistency needs a design system plus governance
                  - listitem [ref=f4e505]: ✕ Local development, observability and E2E testing get harder
            - paragraph [ref=f4e506]:
              - strong [ref=f4e507]: "In practice:"
              - text: stay a monolith until deploy contention, team count or domain boundaries make the shared release train the bottleneck. Micro frontends buy autonomy, and you pay for it in infrastructure.
