          - generic [ref=f3e170]:
            - generic [ref=f3e172]:
              - article [ref=f3e173]:
                - heading "Monolith" [level=4] [ref=f3e174]
                - paragraph [ref=f3e175]: One codebase, one build, one deploy.
                - paragraph [ref=f3e176]: Strengths
                - list [ref=f3e177]:
                  - listitem [ref=f3e178]: ✓ Simplest mental model — a single repo, toolchain and build
                  - listitem [ref=f3e179]: ✓ Sharing code is just an import; no runtime integration cost
                  - listitem [ref=f3e180]: ✓ One bundle, so dependency versions and UI stay consistent by default
                  - listitem [ref=f3e181]: ✓ Local development, debugging and end-to-end testing are straightforward
                - paragraph [ref=f3e182]: Trade-offs
                - list [ref=f3e183]:
                  - listitem [ref=f3e184]: ✕ Every team rides the same release train — one bad merge blocks everyone
                  - listitem [ref=f3e185]: ✕ Build and CI times grow with the codebase
                  - listitem [ref=f3e186]: ✕ Framework and major-version upgrades become all-or-nothing events
                  - listitem [ref=f3e187]: ✕ Ownership boundaries blur as the application grows
              - article [ref=f3e188]:
                - heading "Micro Frontends" [level=4] [ref=f3e189]
                - paragraph [ref=f3e190]: Independent apps per team, composed at runtime.
                - paragraph [ref=f3e191]: Strengths
                - list [ref=f3e192]:
                  - listitem [ref=f3e193]: ✓ Teams ship on their own cadence with no shared release train
                  - listitem [ref=f3e194]: ✓ Failure and upgrade blast radius stays scoped to one domain
                  - listitem [ref=f3e195]: ✓ Stacks can diverge, so upgrades happen incrementally
                  - listitem [ref=f3e196]: ✓ Ownership mirrors team boundaries instead of fighting them
                - paragraph [ref=f3e197]: Trade-offs
                - list [ref=f3e198]:
                  - listitem [ref=f3e199]: ✕ Duplicate dependencies inflate total bytes without deliberate sharing
                  - listitem [ref=f3e200]: ✕ Runtime composition, routing and shared state add real complexity
                  - listitem [ref=f3e201]: ✕ Cross-app consistency needs a design system plus governance
                  - listitem [ref=f3e202]: ✕ Local development, observability and E2E testing get harder
            - paragraph [ref=f3e203]:
              - strong [ref=f3e204]: "In practice:"
              - text: stay a monolith until deploy contention, team count or domain boundaries make the shared release train the bottleneck. Micro frontends buy autonomy, and you pay for it in infrastructure.
