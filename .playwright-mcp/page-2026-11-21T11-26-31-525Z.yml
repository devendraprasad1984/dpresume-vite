          - generic [ref=f5e172]:
            - generic [ref=f5e174]:
              - article [ref=f5e175]:
                - heading "Monolith" [level=4] [ref=f5e176]
                - paragraph [ref=f5e177]: One codebase, one build, one deploy.
                - paragraph [ref=f5e178]: Strengths
                - list [ref=f5e179]:
                  - listitem [ref=f5e180]: ✓ Simplest mental model — a single repo, toolchain and build
                  - listitem [ref=f5e181]: ✓ Sharing code is just an import; no runtime integration cost
                  - listitem [ref=f5e182]: ✓ One bundle, so dependency versions and UI stay consistent by default
                  - listitem [ref=f5e183]: ✓ Local development, debugging and end-to-end testing are straightforward
                - paragraph [ref=f5e184]: Trade-offs
                - list [ref=f5e185]:
                  - listitem [ref=f5e186]: ✕ Every team rides the same release train — one bad merge blocks everyone
                  - listitem [ref=f5e187]: ✕ Build and CI times grow with the codebase
                  - listitem [ref=f5e188]: ✕ Framework and major-version upgrades become all-or-nothing events
                  - listitem [ref=f5e189]: ✕ Ownership boundaries blur as the application grows
              - article [ref=f5e190]:
                - heading "Micro Frontends" [level=4] [ref=f5e191]
                - paragraph [ref=f5e192]: Independent apps per team, composed at runtime.
                - paragraph [ref=f5e193]: Strengths
                - list [ref=f5e194]:
                  - listitem [ref=f5e195]: ✓ Teams ship on their own cadence with no shared release train
                  - listitem [ref=f5e196]: ✓ Failure and upgrade blast radius stays scoped to one domain
                  - listitem [ref=f5e197]: ✓ Stacks can diverge, so upgrades happen incrementally
                  - listitem [ref=f5e198]: ✓ Ownership mirrors team boundaries instead of fighting them
                - paragraph [ref=f5e199]: Trade-offs
                - list [ref=f5e200]:
                  - listitem [ref=f5e201]: ✕ Duplicate dependencies inflate total bytes without deliberate sharing
                  - listitem [ref=f5e202]: ✕ Runtime composition, routing and shared state add real complexity
                  - listitem [ref=f5e203]: ✕ Cross-app consistency needs a design system plus governance
                  - listitem [ref=f5e204]: ✕ Local development, observability and E2E testing get harder
            - paragraph [ref=f5e205]:
              - strong [ref=f5e206]: "In practice:"
              - text: stay a monolith until deploy contention, team count or domain boundaries make the shared release train the bottleneck. Micro frontends buy autonomy, and you pay for it in infrastructure.
