          - generic [ref=f1e170]:
            - generic [ref=f1e171]:
              - article [ref=f1e172]:
                - heading "Monolith" [level=4] [ref=f1e173]
                - paragraph [ref=f1e174]: One codebase, one build, one deploy.
                - paragraph [ref=f1e175]: Strengths
                - list [ref=f1e176]:
                  - listitem [ref=f1e177]: ✓ Simplest mental model — a single repo, toolchain and build
                  - listitem [ref=f1e178]: ✓ Sharing code is just an import; no runtime integration cost
                  - listitem [ref=f1e179]: ✓ One bundle, so dependency versions and UI stay consistent by default
                  - listitem [ref=f1e180]: ✓ Local development, debugging and end-to-end testing are straightforward
                - paragraph [ref=f1e181]: Trade-offs
                - list [ref=f1e182]:
                  - listitem [ref=f1e183]: ✕ Every team rides the same release train — one bad merge blocks everyone
                  - listitem [ref=f1e184]: ✕ Build and CI times grow with the codebase
                  - listitem [ref=f1e185]: ✕ Framework and major-version upgrades become all-or-nothing events
                  - listitem [ref=f1e186]: ✕ Ownership boundaries blur as the application grows
              - article [ref=f1e187]:
                - heading "Micro Frontends" [level=4] [ref=f1e188]
                - paragraph [ref=f1e189]: Independent apps per team, composed at runtime.
                - paragraph [ref=f1e190]: Strengths
                - list [ref=f1e191]:
                  - listitem [ref=f1e192]: ✓ Teams ship on their own cadence with no shared release train
                  - listitem [ref=f1e193]: ✓ Failure and upgrade blast radius stays scoped to one domain
                  - listitem [ref=f1e194]: ✓ Stacks can diverge, so upgrades happen incrementally
                  - listitem [ref=f1e195]: ✓ Ownership mirrors team boundaries instead of fighting them
                - paragraph [ref=f1e196]: Trade-offs
                - list [ref=f1e197]:
                  - listitem [ref=f1e198]: ✕ Duplicate dependencies inflate total bytes without deliberate sharing
                  - listitem [ref=f1e199]: ✕ Runtime composition, routing and shared state add real complexity
                  - listitem [ref=f1e200]: ✕ Cross-app consistency needs a design system plus governance
                  - listitem [ref=f1e201]: ✕ Local development, observability and E2E testing get harder
            - paragraph [ref=f1e202]:
              - strong [ref=f1e203]: "In practice:"
              - text: stay a monolith until deploy contention, team count or domain boundaries make the shared release train the bottleneck. Micro frontends buy autonomy, and you pay for it in infrastructure.
