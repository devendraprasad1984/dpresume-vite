      - generic [ref=f14e365]:
        - heading "Design Pattern Table" [level=1] [ref=f14e366]
        - generic [ref=f14e367]:
          - generic [ref=f14e368]: Design patterns are broadly classified into 3 categories viz creational, structural, behavioural
          - generic [ref=f14e369]:
            - generic [ref=f14e370]: Creational Design Pattern
            - generic [ref=f14e371]:
              - generic [ref=f14e372]: Factory method
              - generic [ref=f14e373]: Makes an instance of several derived classes based on interfaced data or events
            - generic [ref=f14e374]:
              - generic [ref=f14e375]: Abstract factory
              - generic [ref=f14e376]: creates an instance of several families of classes without detailing concrete classes
            - generic [ref=f14e377]:
              - generic [ref=f14e378]: Builder
              - generic [ref=f14e379]: Separates object construction from its representations; always creates the same type of objects
            - generic [ref=f14e380]:
              - generic [ref=f14e381]: Prototype
              - generic [ref=f14e382]: fully initialised instance used for copying or cloning
          - generic [ref=f14e383]:
            - generic [ref=f14e384]: Structural Design Pattern
            - generic [ref=f14e385]:
              - generic [ref=f14e386]: Singleton
              - generic [ref=f14e387]: A class with only single instance with global access points, gloabl data sharing object eg logger / context object / redux global state
            - generic [ref=f14e388]:
              - generic [ref=f14e389]: Adapter
              - generic [ref=f14e390]: matches interfaces of different classes so that classes can work together despite incompatible interfaces
            - generic [ref=f14e391]:
              - generic [ref=f14e392]: Bridge
              - generic [ref=f14e393]: Separates an objects interface from its implementation so that the two can vary independently
            - generic [ref=f14e394]:
              - generic [ref=f14e395]: Composite
              - generic [ref=f14e396]: A structure of simple and composite objects that makes the total object more that just the sum of its parts
            - generic [ref=f14e397]:
              - generic [ref=f14e398]: Decorator
              - generic [ref=f14e399]: Dynamically adds alternate processing of objects
            - generic [ref=f14e400]:
              - generic [ref=f14e401]: Facade
              - generic [ref=f14e402]: A single class that hides the complexity of an entire ecosystem
            - generic [ref=f14e403]:
              - generic [ref=f14e404]: Flyweight
              - generic [ref=f14e405]: A fine grained instance used for efficient sharing of information that is contained elsewhere
            - generic [ref=f14e406]:
              - generic [ref=f14e407]: Proxy
              - generic [ref=f14e408]: A placeholder object representing the true object
          - generic [ref=f14e409]:
            - generic [ref=f14e410]: Behavioural Design Pattern
            - generic [ref=f14e411]:
              - generic [ref=f14e412]: Interpreter
              - generic [ref=f14e413]: A way to include language elements in an application to match the grammar of the intended language
            - generic [ref=f14e414]:
              - generic [ref=f14e415]: Template method
              - generic [ref=f14e416]: Creates the shell of an algorithm in a method, then defers the exact steps to a subclass
            - generic [ref=f14e417]:
              - generic [ref=f14e418]: Chain of responsibility
              - generic [ref=f14e419]: A way of passing a request between a chain of objects to find the object that can handle the request
            - generic [ref=f14e420]:
              - generic [ref=f14e421]: Command
              - generic [ref=f14e422]: A way to separate the execution of a command from its invoker
            - generic [ref=f14e423]:
              - generic [ref=f14e424]: Iterator
              - generic [ref=f14e425]: sequentially access the elements of a collection without knowing the inner working of the collection eg GenericList(T)
            - generic [ref=f14e426]:
              - generic [ref=f14e427]: Mediator
              - generic [ref=f14e428]: defines simplified communications between classes to prevent a group of classes from referring explicitly to each other
            - generic [ref=f14e429]:
              - generic [ref=f14e430]: Memento
              - generic [ref=f14e431]: captures an objects internal state to be able to restore it later
            - generic [ref=f14e432]:
              - generic [ref=f14e433]: Observer
              - generic [ref=f14e434]: A way of notifying change to number of classes to ensure consistency between the classes
            - generic [ref=f14e435]:
              - generic [ref=f14e436]: State
              - generic [ref=f14e437]: Alters an objects behaviour when its state changes, eg form depending on state of a reducer triggering middleware
            - generic [ref=f14e438]:
              - generic [ref=f14e439]: Strategy
              - generic [ref=f14e440]: Encapsulates an algo inside a class, separating the selection from its implementation
            - generic [ref=f14e441]:
              - generic [ref=f14e442]: Visitor
              - generic [ref=f14e443]: Adds a new operation to a class without changing the class
